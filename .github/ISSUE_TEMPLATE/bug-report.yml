name: Bug report
description: Report a bug, then set its priority with a label.
body:
  - type: input
    attributes:
      label: "Plugin version:"
      description: "The version of the broken plugin and of StormCore (for example the output of /version <plugin>)."
      placeholder: "e.g. StormLogger 2.0.2, StormCore 2.3.0"
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Which server software has the bug?
      description: Select every server type where the bug happens.
      options:
        - label: Velocity
          required: false
        - label: Carbon
          required: false
        - label: Purpur
          required: false
        - label: Folia
          required: false
        - label: Other [described below]
          required: false
  - type: input
    attributes:
      label: "Other server software:"
      placeholder: "e.g. HamburgerSpigot"
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Which Java version does the server run?
      description: Select the Java version of every server where the bug happens.
      options:
        - label: Eclipse Temurin 25
          required: false
        - label: GraalVM 25
          required: false
        - label: Other [described below]
          required: false
  - type: input
    attributes:
      label: "Other Java version:"
      placeholder: "e.g. OpenJDK 18"
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Which Minecraft version does the server run?
      description: Select the Minecraft version of every server where the bug happens.
      options:
        - label: "1.8.8"
          required: false
        - label: "1.18.2"
          required: false
        - label: "1.20.4"
          required: false
        - label: "26.1 (latest Minecraft version)"
          required: false
        - label: Other [described below]
          required: false
  - type: input
    attributes:
      label: "Other Minecraft version:"
      placeholder: "e.g. 27.3 or 1.17.1"
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: How was the bug found?
      description: Select how the bug came to light.
      options:
        - label: Reported by a player
          required: false
        - label: Reported by a tester
          required: false
        - label: Reported by a team member
          required: false
        - label: Noticed by a developer
          required: false
  - type: textarea
    attributes:
      label: On which server(s) did the bug happen?
      description: "If there are many, a group is enough, e.g. BedWars servers, lobbies."
      placeholder: "The exact server names, or the group of servers where the bug happened."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "How exactly can the bug be reproduced?"
      description: "Describe briefly, but with attention to detail, how the bug happens."
      placeholder: "Step-by-step description of how to trigger the bug, ideally with a screenshot or video."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "What is the exact error message?"
      description: "Paste the error message as text or as a screenshot."
      placeholder: "Error caused by: ConcurrentModificationException in hu.blockstorm....."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "What should happen instead?"
      description: "If needed, describe the expected behaviour without the bug."
      placeholder: "e.g. Typing /spawn should teleport you to spawn."
    validations:
      required: false
  - type: textarea
    attributes:
      label: "Other information"
      description: Anything else you think could be important.
      placeholder: "e.g. The bug only happens in the morning."
